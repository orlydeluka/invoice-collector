<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>חשבוניות למייל</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#667085; --accent:#2563eb; --ok:#15803d; --err:#b91c1c; --border:#d9dee7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --card:#1b2029; --text:#e6e9ef; --muted:#9aa3b2; --accent:#60a5fa; --ok:#4ade80; --err:#f87171; --border:#2c3340; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif; }
  main { max-width:520px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  label { display:block; font-weight:600; margin:12px 0 6px; }
  textarea, input { width:100%; font:inherit; color:inherit; background:transparent; border:1px solid var(--border); border-radius:8px; padding:10px; }
  textarea { min-height:120px; direction:ltr; text-align:left; }
  button { margin-top:16px; width:100%; font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:8px; padding:12px; cursor:pointer; }
  button:disabled { opacity:.6; }
  #status { margin-top:14px; white-space:pre-wrap; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  details { margin-top:12px; color:var(--muted); }
  h2 { font-size:18px; margin:32px 0 4px; }
  .row { display:flex; gap:8px; align-items:center; margin-top:12px; }
  .row input[type=checkbox] { width:auto; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  progress { width:100%; margin-top:12px; }
  ul.links { max-height:240px; overflow:auto; direction:ltr; text-align:left; font-size:13px; padding-left:18px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>חשבוניות למייל</h1>
  <p class="sub">הדביקי לינק לחשבונית או את כל ההודעה. החשבונית תורד ותישלח כ-PDF למייל.</p>
  <form class="card" id="f">
    <label for="text">לינק או הודעה</label>
    <textarea id="text" required placeholder="https://..."></textarea>
    <details id="tokbox">
      <summary>טוקן גישה</summary>
      <input id="token" type="password" autocomplete="off" placeholder="API_TOKEN">
    </details>
    <button id="btn">שליחה למייל</button>
    <div id="status" role="status"></div>
  </form>

  <h2>ייבוא חשבוניות מהעבר</h2>
  <p class="sub">מעלים קבצי ייצוא של צ'אטים מווטסאפ (zip או txt) או ייצוא של הודעות SMS (csv או txt). כל החשבוניות מהתאריך שבוחרים יורדו ויישלחו למייל, ובסוף יגיע מייל סיכום.</p>
  <form class="card" id="hf">
    <label for="files">קבצי ייצוא</label>
    <input id="files" type="file" multiple accept=".zip,.txt,.csv" required>
    <label for="from">מתאריך</label>
    <input id="from" type="date" value="2024-01-01" required>
    <div class="row">
      <input id="kw" type="checkbox" checked>
      <label for="kw" style="margin:0;font-weight:400">רק הודעות עם המילים חשבונית / קבלה / invoice / receipt</label>
    </div>
    <button type="button" class="secondary" id="check">בדיקה: כמה חשבוניות נמצאו?</button>
    <button id="hbtn">התחלת ייבוא ושליחה למייל</button>
    <progress id="prog" hidden></progress>
    <div id="hstatus" role="status"></div>
    <ul class="links" id="list" hidden></ul>
  </form>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const store = {
    get() { try { return localStorage.getItem('invoiceToken') || ''; } catch { return ''; } },
    set(v) { try { localStorage.setItem('invoiceToken', v); } catch {} },
  };
  $('token').value = store.get();
  if (!$('token').value) $('tokbox').open = true;

  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const token = $('token').value.trim();
    store.set(token);
    $('btn').disabled = true;
    $('status').className = '';
    $('status').textContent = 'מוריד ושולח… (עד דקה)';
    try {
      const res = await fetch('/api/invoice', {
        method: 'POST',
        headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
        body: JSON.stringify({ text: $('text').value, source: 'manual', wait: true, force: true }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.status);
      const lines = data.results.map((r) => (r.ok ? '✓ נשלח: ' + r.filename : '✗ נכשל: ' + r.url + '\n  ' + r.error));
      $('status').className = data.results.every((r) => r.ok) ? 'ok' : 'err';
      $('status').textContent = lines.join('\n');
      if (data.results.every((r) => r.ok)) $('text').value = '';
    } catch (err) {
      $('status').className = 'err';
      $('status').textContent = 'שגיאה: ' + err.message;
    } finally {
      $('btn').disabled = false;
    }
  });

  // ---- ייבוא היסטוריה ----
  const auth = () => ({ authorization: 'Bearer ' + $('token').value.trim() });
  function hset(msg, cls) { $('hstatus').className = cls || ''; $('hstatus').textContent = msg; }

  async function uploadAll() {
    const token = $('token').value.trim();
    if (!token) { $('tokbox').open = true; throw new Error('צריך למלא טוקן גישה (למעלה)'); }
    store.set(token);
    const batch = crypto.randomUUID();
    const files = [...$('files').files];
    for (let i = 0; i < files.length; i++) {
      hset(`מעלה קובץ ${i + 1} מתוך ${files.length}…`);
      const res = await fetch('/api/backfill/upload?batch=' + batch, {
        method: 'POST',
        headers: { ...auth(), 'content-type': 'application/octet-stream', 'x-filename': encodeURIComponent(files[i].name) },
        body: files[i],
      });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
    }
    return batch;
  }

  async function start(dryRun) {
    if (!$('files').files.length) throw new Error('בחרי קבצים');
    const batch = await uploadAll();
    hset('קורא את ההודעות…');
    const res = await fetch('/api/backfill/start', {
      method: 'POST',
      headers: { ...auth(), 'content-type': 'application/json' },
      body: JSON.stringify({ batch, from: $('from').value, keywordsOnly: $('kw').checked, dryRun }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
    return data;
  }

  async function guard(fn) {
    $('hbtn').disabled = $('check').disabled = true;
    try { await fn(); } catch (err) { hset('שגיאה: ' + err.message, 'err'); }
    finally { $('hbtn').disabled = $('check').disabled = false; }
  }

  $('check').addEventListener('click', () => guard(async () => {
    const d = await start(true);
    hset(`נסרקו ${d.messages} הודעות. נמצאו ${d.found} לינקים, מתוכם ${d.alreadySent} כבר נשלחו בעבר.\nיישלחו ${d.links.length} חשבוניות.`, 'ok');
    $('list').hidden = !d.links.length;
    $('list').innerHTML = '';
    for (const l of d.links) { const li = document.createElement('li'); li.textContent = l.date + '  ' + l.url; $('list').appendChild(li); }
  }));

  $('hf').addEventListener('submit', (e) => { e.preventDefault(); guard(async () => {
    $('list').hidden = true;
    let job = await start(false);
    if (!job.total) { hset('לא נמצאו חשבוניות חדשות לשליחה.', 'ok'); return; }
    $('prog').hidden = false;
    $('prog').max = job.total;
    while (!job.finished) {
      $('prog').value = job.done;
      hset(`מעבד ${job.done} מתוך ${job.total} (נשלחו ${job.ok}, נכשלו ${job.failed.length})… אפשר לסגור את הדף, העבודה ממשיכה בשרת.`);
      await new Promise((r) => setTimeout(r, 4000));
      const res = await fetch('/api/backfill/' + job.id, { headers: auth() });
      if (res.ok) job = await res.json();
    }
    $('prog').value = job.total;
    hset(`הסתיים! נשלחו ${job.ok} חשבוניות, ${job.failed.length} נכשלו. מייל סיכום נשלח אלייך.`, 'ok');
  }); });
</script>
</body>
</html>
