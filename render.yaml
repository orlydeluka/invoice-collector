# פריסה בלחיצה ב-Render: New → Blueprint → בחירת הריפו
services:
  - type: web
    name: invoice-collector
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: API_TOKEN
        generateValue: true
      - key: MAIL_TO
        value: orlyg@timlul.com
      - key: MAIL_FROM
        value: orlyg@timlul.com
      # Brevo (חינמי עד 300 מיילים ביום). ל-Gmail: smtp.gmail.com / 465 / true
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: KEYWORDS
        value: חשבונית,קבלה,invoice,receipt
